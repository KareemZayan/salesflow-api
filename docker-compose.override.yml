# Dev-only: picked up automatically by `docker compose up`.
# Production-like run: docker compose -f docker-compose.yml up --build
services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'

  redis:
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      # Keep the image's Linux node_modules instead of the host's.
      - api_node_modules:/app/node_modules

volumes:
  api_node_modules:
